<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألوان | أكاديمية المرح</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .color-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .color-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        .color-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .color-blob {
            width: 100px;
            height: 100px;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            margin: 0 auto 20px;
            transition: border-radius 0.3s;
        }
        .color-card:hover .color-blob {
            border-radius: 50%;
        }
        .color-name {
            font-family: var(--font-main);
            font-size: 1.5rem;
            font-weight: 700;
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5656416032906373" crossorigin="anonymous"></script>
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="../index.html" class="logo">
                <span>✦</span>
                أكاديمية المرح
            </a>
            <div class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="shapes.html">الأشكال</a>
                <a href="animals.html">الحيوانات</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
        <h1 class="section-title text-center">عالم الألوان</h1>
        <p class="text-center" style="font-size: 1.2rem; color: var(--color-text-light);">اضغط على اللون لتستمع إلى اسمه.</p>

        <div class="color-board" id="color-board"></div>

        <!-- AdSense الإعلانات الصورية 05 -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5656416032906373" data-ad-slot="6505685868" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>

    <script type="module">
        import { playTone, speakText } from '../js/utils.js';

        const colors = [
            { name: 'أحمر', hex: '#ef4444' },
            { name: 'أزرق', hex: '#3b82f6' },
            { name: 'أصفر', hex: '#eab308' },
            { name: 'أخضر', hex: '#22c55e' },
            { name: 'برتقالي', hex: '#f97316' },
            { name: 'بنفسجي', hex: '#a855f7' },
            { name: 'وردي', hex: '#ec4899' },
            { name: 'بني', hex: '#8b4513' },
            { name: 'أسود', hex: '#1f2937' },
            { name: 'أبيض', hex: '#f8fafc', border: '#e2e8f0' }
        ];

        const board = document.getElementById('color-board');

        colors.forEach(color => {
            const card = document.createElement('div');
            card.className = `color-card`;

            const borderStyle = color.border ? `border: 2px solid ${color.border};` : '';

            card.innerHTML = `
                <div class="color-blob" style="background-color: ${color.hex}; ${borderStyle}"></div>
                <div class="color-name" style="color: ${color.name === 'أبيض' ? '#1f2937' : color.hex}">${color.name}</div>
            `;
            card.onclick = () => {
                playTone('tap');
                speakText(color.name, 'ar-SA');
            };
            board.appendChild(card);
        });
    </script>
    <script src="../js/navbar.js"></script>
    <script src="../js/rewards.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأرقام | أكاديمية المرح</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .number-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .number-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(248,200,80,0.2);
        }
        .number-digit {
            font-family: var(--font-main);
            font-size: 4.5rem;
            color: #d69e0b;
            margin-bottom: 10px;
            line-height: 1;
        }
        .number-word {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .dots-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 15px;
            min-height: 40px;
        }
        .dot {
            width: 15px;
            height: 15px;
            background-color: var(--color-accent);
            border-radius: 50%;
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5656416032906373" crossorigin="anonymous"></script>
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="../index.html" class="logo">
                <span>✦</span>
                أكاديمية المرح
            </a>
            <div class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="arabic.html">العربية</a>
                <a href="english.html">الإنكليزية</a>
                <a href="games.html">الألعاب</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 60px; text-align: center;">
        <h1 class="section-title" style="color: #d69e0b;">الأرقام والحساب</h1>
        <p style="font-size: 1.2rem; color: var(--color-text-light);">اضغط على الرقم لتستمع إلى اسمه وشاهد عدد النقاط.</p>

        <!-- AdSense الإعلانات الصورية 08 -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5656416032906373" data-ad-slot="5542746534" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="numbers-grid" id="numbers-board"></div>
    </main>

    <script type="module">
        import { playTone, speakText } from '../js/utils.js';

        const numberWords = ["صفر", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة", "عشرة"];
        const board = document.getElementById('numbers-board');

        for (let i = 1; i <= 10; i++) {
            const card = document.createElement('div');
            card.className = 'number-card';

            let dotsHtml = '';
            for (let j = 0; j < i; j++) {
                dotsHtml += `<div class="dot"></div>`;
            }

            card.innerHTML = `
                <div class="number-digit">${i}</div>
                <div class="number-word">${numberWords[i]}</div>
                <div class="dots-container">${dotsHtml}</div>
            `;
            card.onclick = () => {
                playTone('tap');
                speakText(numberWords[i], 'ar-SA');
            };
            board.appendChild(card);
        }
    </script>
    <script src="../js/navbar.js"></script>
    <script src="../js/rewards.js"></script>
</body>
</html>

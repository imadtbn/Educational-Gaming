<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Time | Fun Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { direction: ltr; }
        .nav { flex-direction: row-reverse; }
        .nav-links { direction: rtl; }
        .section-title { font-family: 'Baloo Bhaijaan 2', sans-serif; font-size: 3rem; margin-bottom: 10px; }
        .subtitle { font-family: 'Cairo', sans-serif; color: var(--color-text-light); font-size: 1.2rem; margin-bottom: 40px; }
        .letter-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .letter-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .letter-card:hover {
            border-color: var(--color-secondary);
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(244,128,106,0.2);
        }
        .letter-char {
            font-family: 'Baloo Bhaijaan 2', sans-serif;
            font-size: 4.5rem;
            color: var(--color-secondary);
            margin-bottom: 10px;
            line-height: 1;
        }
        .letter-word {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text);
            font-family: 'Cairo', sans-serif;
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5656416032906373" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="container nav">
            <a href="../index.html" class="logo" style="direction: rtl;">
                <span>✦</span>
                أكاديمية المرح
            </a>
            <div class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="arabic.html">العربية</a>
                <a href="numbers.html">الأرقام</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 60px; text-align: center;">
        <h1 class="section-title" style="color: var(--color-secondary);">English Alphabet</h1>
        <p class="subtitle">Click on a letter to hear its sound and a word!</p>

        <!-- AdSense الإعلانات الصورية 07 -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5656416032906373" data-ad-slot="1307988056" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="letter-board" id="english-board"></div>
    </main>

    <script type="module">
        import { playTone, speakText } from '../js/utils.js';

        const englishLetters = [
            { char: "A", word: "Apple", sound: "A... Apple" },
            { char: "B", word: "Bear", sound: "B... Bear" },
            { char: "C", word: "Cat", sound: "C... Cat" },
            { char: "D", word: "Dog", sound: "D... Dog" },
            { char: "E", word: "Elephant", sound: "E... Elephant" },
            { char: "F", word: "Fish", sound: "F... Fish" },
            { char: "G", word: "Giraffe", sound: "G... Giraffe" },
            { char: "H", word: "Horse", sound: "H... Horse" },
            { char: "I", word: "Ice cream", sound: "I... Ice cream" },
            { char: "J", word: "Juice", sound: "J... Juice" },
            { char: "K", word: "Kangaroo", sound: "K... Kangaroo" },
            { char: "L", word: "Lion", sound: "L... Lion" },
            { char: "M", word: "Monkey", sound: "M... Monkey" },
            { char: "N", word: "Nest", sound: "N... Nest" },
            { char: "O", word: "Orange", sound: "O... Orange" },
            { char: "P", word: "Penguin", sound: "P... Penguin" },
            { char: "Q", word: "Queen", sound: "Q... Queen" },
            { char: "R", word: "Rabbit", sound: "R... Rabbit" },
            { char: "S", word: "Sun", sound: "S... Sun" },
            { char: "T", word: "Tiger", sound: "T... Tiger" },
            { char: "U", word: "Umbrella", sound: "U... Umbrella" },
            { char: "V", word: "Van", sound: "V... Van" },
            { char: "W", word: "Whale", sound: "W... Whale" },
            { char: "X", word: "Xylophone", sound: "X... Xylophone" },
            { char: "Y", word: "Yellow", sound: "Y... Yellow" },
            { char: "Z", word: "Zebra", sound: "Z... Zebra" }
        ];

        const board = document.getElementById('english-board');

        englishLetters.forEach(item => {
            const card = document.createElement('div');
            card.className = 'letter-card';
            card.innerHTML = `
                <div class="letter-char">${item.char}</div>
                <div class="letter-word">${item.word}</div>
            `;
            card.onclick = () => {
                playTone('tap');
                speakText(item.sound, 'en-US');
            };
            board.appendChild(card);
        });
    </script>
</body>
</html>

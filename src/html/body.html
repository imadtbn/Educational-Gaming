<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجزاء الجسم | أكاديمية المرح</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .body-parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .body-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
            border-right: 5px solid var(--color-primary);
        }
        .body-card:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(17,127,134,0.15);
        }
        .body-icon {
            font-size: 3rem;
        }
        .body-name {
            font-family: var(--font-main);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .body-desc {
            font-size: 0.9rem;
            color: var(--color-text-light);
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5656416032906373" crossorigin="anonymous"></script>
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="../index.html" class="logo">
                <span>✦</span>
                أكاديمية المرح
            </a>
            <div class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="colors.html">الألوان</a>
                <a href="shapes.html">الأشكال</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
        <h1 class="section-title text-center">أجزاء الجسم</h1>
        <p class="text-center" style="font-size: 1.2rem; color: var(--color-text-light);">اضغط على الجزء لتستمع إلى اسمه.</p>

        <div class="body-parts-grid" id="body-board"></div>

        <!-- AdSense الإعلانات الصورية 06 -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5656416032906373" data-ad-slot="6461453831" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>

    <script type="module">
        import { playTone, speakText } from '../js/utils.js';

        const bodyParts = [
            { id: 'head', name: 'رأس', emoji: '🧑', desc: 'نفكر به' },
            { id: 'eye', name: 'عين', emoji: '👁️', desc: 'نرى بها الأشياء الجميلة' },
            { id: 'ear', name: 'أذن', emoji: '👂', desc: 'نسمع بها الأصوات' },
            { id: 'nose', name: 'أنف', emoji: '👃', desc: 'نشم به الروائح' },
            { id: 'mouth', name: 'فم', emoji: '👄', desc: 'نتحدث ونأكل به' },
            { id: 'tooth', name: 'أسنان', emoji: '🦷', desc: 'نمضغ بها الطعام' },
            { id: 'hand', name: 'يد', emoji: '✋', desc: 'نمسك بها الأشياء' },
            { id: 'leg', name: 'رجل', emoji: '🦵', desc: 'نمشي ونركض بها' },
            { id: 'foot', name: 'قدم', emoji: '🦶', desc: 'نقف عليها' }
        ];

        const board = document.getElementById('body-board');

        bodyParts.forEach((part, index) => {
            const card = document.createElement('div');
            card.className = `body-card`;

            // Alternate border colors
            const colors = ['var(--color-primary)', 'var(--color-secondary)', 'var(--color-accent)', 'var(--color-purple)'];
            card.style.borderRightColor = colors[index % colors.length];

            card.innerHTML = `
                <div class="body-icon">${part.emoji}</div>
                <div>
                    <div class="body-name">${part.name}</div>
                    <div class="body-desc">${part.desc}</div>
                </div>
            `;
            card.onclick = () => {
                playTone('tap');
                speakText(part.name, 'ar-SA');
            };
            board.appendChild(card);
        });
    </script>
    <script src="../js/navbar.js"></script>
    <script src="../js/rewards.js"></script>
</body>
</html>

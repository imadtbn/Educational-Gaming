<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحروف العربية | أكاديمية المرح</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .letter-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .letter-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .letter-card:hover {
            border-color: var(--color-primary);
            transform: scale(1.05);
        }
        .letter-char {
            font-family: var(--font-main);
            font-size: 4rem;
            color: var(--color-primary);
            margin-bottom: 10px;
            line-height: 1;
        }
        .letter-word {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-text);
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5656416032906373" crossorigin="anonymous"></script>
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="../index.html" class="logo">
                <span>✦</span>
                أكاديمية المرح
            </a>
            <div class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="english.html">English Time</a>
                <a href="numbers.html">الأرقام</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px;">
        <h1 class="section-title text-center">الحروف العربية</h1>
        <p class="text-center" style="font-size: 1.2rem; color: var(--color-text-light);">اضغط على الحرف لتستمع إلى صوته وكلمة تبدأ به.</p>

        <div class="letter-board" id="arabic-board"></div>

        <!-- AdSense 03 إعلان داخل الخلاصة-->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-ad-layout-key="-fb+5w+4e-db+86" data-ad-client="ca-pub-5656416032906373" data-ad-slot="1315961685"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>

    <script type="module">
        import { playTone, speakText } from '../js/utils.js';

        const arabicLetters = [
            { char: "أ", word: "أرنب", sound: "أ... أَرنب" },
            { char: "ب", word: "بطة", sound: "ب... بَطَّة" },
            { char: "ت", word: "تفاحة", sound: "ت... تُفّاحة" },
            { char: "ث", word: "ثعلب", sound: "ث... ثَعلب" },
            { char: "ج", word: "جمل", sound: "ج... جَمَل" },
            { char: "ح", word: "حصان", sound: "ح... حِصان" },
            { char: "خ", word: "خروف", sound: "خ... خَروف" },
            { char: "د", word: "ديك", sound: "د... دِيك" },
            { char: "ذ", word: "ذئب", sound: "ذ... ذِئب" },
            { char: "ر", word: "رمان", sound: "ر... رُمّان" },
            { char: "ز", word: "زرافة", sound: "ز... زَرافة" },
            { char: "س", word: "سمكة", sound: "س... سَمكة" },
            { char: "ش", word: "شمس", sound: "ش... شَمس" },
            { char: "ص", word: "صقر", sound: "ص... صَقر" },
            { char: "ض", word: "ضفدع", sound: "ض... ضِفدع" },
            { char: "ط", word: "طائرة", sound: "ط... طائرة" },
            { char: "ظ", word: "ظرف", sound: "ظ... ظَرف" },
            { char: "ع", word: "عصفور", sound: "ع... عُصفور" },
            { char: "غ", word: "غزالة", sound: "غ... غَزالة" },
            { char: "ف", word: "فيل", sound: "ف... فِيل" },
            { char: "ق", word: "قرد", sound: "ق... قِرد" },
            { char: "ك", word: "كلب", sound: "ك... كَلب" },
            { char: "ل", word: "ليمون", sound: "ل... لَيمون" },
            { char: "م", word: "موز", sound: "م... مَوز" },
            { char: "ن", word: "نحلة", sound: "ن... نَحلة" },
            { char: "هـ", word: "هدهد", sound: "هـ... هُدهد" },
            { char: "و", word: "وردة", sound: "و... وَردة" },
            { char: "ي", word: "يمامة", sound: "ي... يَمامة" }
        ];

        const board = document.getElementById('arabic-board');

        arabicLetters.forEach(item => {
            const card = document.createElement('div');
            card.className = 'letter-card';
            card.innerHTML = `
                <div class="letter-char">${item.char}</div>
                <div class="letter-word">${item.word}</div>
            `;
            card.onclick = () => {
                playTone('tap');
                speakText(item.sound, 'ar-SA');
            };
            board.appendChild(card);
        });
    </script>
    <script src="../js/navbar.js"></script>
    <script src="../js/rewards.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية المرح | الفصول الأربعة</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        .season-card { text-align: center; cursor: pointer; padding: 40px 20px;}
        .season-emoji { font-size: 6rem; margin-bottom: 15px; }
        .sound-btn { background: var(--color-primary); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; margin: 5px; }
        .sound-btn.eng { background: var(--color-secondary); }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5656416032906373" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="container nav">
            <a href="../index.html" class="logo">✦ أكاديمية المرح</a>
            <div class="nav-links">
                <a href="../index.html">الرئيسية</a>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="section-title text-center mt-4">الفصول الأربعة</h1>
        <p class="text-center mb-4">تعرف على فصول السنة وما يميزها!</p>

        <div class="grid-cards" id="seasons-grid">
            <!-- Populated by JS -->
        </div>
    </main>

    <script src="../js/navbar.js"></script>
    <script src="../js/rewards.js"></script>
    <script>
        const seasons = [
            { ar: "الصيف", en: "Summer", emoji: "☀️", color: "yellow", desc: "الشمس الساطعة والبحر." },
            { ar: "الخريف", en: "Autumn", emoji: "🍂", color: "coral", desc: "تساقط أوراق الشجر." },
            { ar: "الشتاء", en: "Winter", emoji: "⛄", color: "teal", desc: "البرد والمطر والثلج." },
            { ar: "الربيع", en: "Spring", emoji: "🌸", color: "purple", desc: "الأزهار المتفتحة والجو الجميل." }
        ];

        function speak(text, lang) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        const grid = document.getElementById('seasons-grid');
        seasons.forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${item.color} season-card`;
            card.innerHTML = `
                <div class="season-emoji">${item.emoji}</div>
                <h3>${item.ar}</h3>
                <p style="color:var(--color-text-light); font-family: sans-serif; font-weight: bold;">${item.en}</p>
                <p style="font-size: 0.9rem; margin-top: 10px; margin-bottom: 15px;">${item.desc}</p>
                <div>
                    <button class="sound-btn" onclick="speak('${item.ar}', 'ar-SA')">🔊</button>
                    <button class="sound-btn eng" onclick="speak('${item.en}', 'en-US')">🗣️</button>
                </div>
            `;
            const btns = card.querySelectorAll('button');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                   if(Math.random() > 0.5) window.rewards.addStars(1);
                });
            });
            grid.appendChild(card);
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#117f86" />
    <title>أكاديمية المرح — دون اتصال</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fffaf0; color: #173f42; font-family: Tahoma, Arial, sans-serif; }
      main { width: min(84vw, 440px); padding: 36px 28px; text-align: center; background: linear-gradient(135deg, #edf7f0, #fff0d4); border: 2px dashed #d2ab54; border-radius: 34px 7px 34px 7px; box-shadow: 9px 10px 0 rgba(17,127,134,.08); }
      .mark { display: grid; width: 64px; height: 64px; place-items: center; margin: 0 auto 16px; color: #fff; background: #117f86; border-radius: 50%; font-size: 29px; }
      h1 { margin: 0; font-size: 26px; } p { color: #59716a; line-height: 1.9; } button { padding: 10px 16px; color: #fff; background: #117f86; border: 0; border-radius: 999px; font-weight: 700; }
    </style>
  </head>
  <body><main><div class="mark">✦</div><h1>نحتاج إلى اتصال صغير</h1><p>تأكد من الإنترنت، ثم عد إلى رحلتك التعليمية لنكمل الاستكشاف واللعب.</p><button onclick="location.reload()">حاول مجددًا</button></main></body>
</html>
